version: 1
applications:
  - appRoot: apps/dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g bun@1.3.14
            - bun install --frozen-lockfile
        build:
          commands:
            - cd apps/dashboard && bun run build
      artifacts:
        baseDirectory: apps/dashboard/.next
        files:
          - "**/*"
      cache:
        paths:
          - apps/dashboard/.next/cache/**/*
          - node_modules/**/*
    buildPath: /
