services:
  llm-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: argus-llm-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_INTERNAL_KEY=${LITELLM_INTERNAL_KEY}
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
      - ./config/argus_gate.py:/app/argus_gate.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
