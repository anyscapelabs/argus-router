# Argus LLM Gateway — LiteLLM Proxy Configuration
# All models route through OpenRouter (single API key)
# This service sits behind the Rust gateway and only accepts internal service key calls
#
# Model IDs match exactly what's in apps/api/catalog/models.json (upstream_model field).
# OpenRouter accepts the model slug directly — no extra prefix needed beyond "openrouter/".

model_list:
  # ─── argus/auto pool ───────────────────────────────────────────────────────
  # Rust forwards "argus/auto" unchanged. LiteLLM alone selects a deployment
  # from this group and handles retries, cooldowns, and fallback models.

  - model_name: argus/auto
    litellm_params:
      model: openrouter/openai/gpt-6-luna
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      id: gpt-6-luna-auto
      max_tokens: 16384

  - model_name: argus/auto
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      id: deepseek-flash-auto
      max_tokens: 65536

