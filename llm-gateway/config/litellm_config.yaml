router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  retry_after: 2
  allowed_fails: 2
  cooldown_time: 60
  # Fall back across providers, then down a tier.
  fallbacks:
    - argus/auto-lite-bedrock:
        - argus/auto-lite-openrouter
    - argus/auto-lite-openrouter:
        - argus/auto-lite-bedrock
    - argus/auto-standard-bedrock:
        - argus/auto-standard-openrouter
        - argus/auto-lite-bedrock
    - argus/auto-standard-openrouter:
        - argus/auto-standard-bedrock
        - argus/auto-lite-openrouter
    - argus/auto-premium-bedrock:
        - argus/auto-premium-openrouter
        - argus/auto-standard-bedrock
    - argus/auto-premium-openrouter:
        - argus/auto-premium-bedrock
        - argus/auto-standard-openrouter
    - argus/auto-ultra-bedrock:
        - argus/auto-ultra-openrouter
        - argus/auto-premium-bedrock
    - argus/auto-ultra-openrouter:
        - argus/auto-ultra-bedrock
        - argus/auto-premium-openrouter

litellm_settings:
  drop_params: true
  request_timeout: 120
  streaming_timeout: 120
  set_verbose: false
  json_logs: true
  include_cost_in_streaming_usage: false
  callbacks: argus_gate.gate

general_settings:
  master_key: os.environ/LITELLM_INTERNAL_KEY
  background_health_checks: false
  always_include_stream_usage: true
  disable_spend_logs: true
  disable_error_logs: false
  store_model_in_db: false
  allow_requests_on_db_fail: true
