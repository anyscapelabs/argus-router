router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  retry_after: 2
  allowed_fails: 2
  cooldown_time: 60
  # If the resolved model fails, fall back through the lite tier
  fallbacks:
    - openai/gpt-6-luna:
        - deepseek/deepseek-v4.1-flash-1017
        - qwen/qwen3.8-flash
        - z-ai/glm-5.3-flash
    - deepseek/deepseek-v4.1-flash-1017:
        - openai/gpt-6-luna
        - qwen/qwen3.8-flash
    - argus/auto:
        - openai/gpt-6-luna
        - deepseek/deepseek-v4.1-flash-1017
        - qwen/qwen3.8-flash

litellm_settings:
  drop_params: true
  request_timeout: 120
  streaming_timeout: 120
  set_verbose: false
  json_logs: true
  # Cost is delivered in the final SSE usage chunk; response headers alone
  # are written before a stream finishes and report zero for streaming calls.
  include_cost_in_streaming_usage: true

general_settings:
  master_key: os.environ/LITELLM_INTERNAL_KEY
  # Inject stream_options.include_usage so the final SSE chunk carries the
  # authoritative token counts without Rust modifying the request body.
  always_include_stream_usage: true
  disable_spend_logs: true
  disable_error_logs: false
  store_model_in_db: false
  allow_requests_on_db_fail: true
