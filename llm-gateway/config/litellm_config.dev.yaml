# Development config — do not use in production
# Argus LLM Gateway — LiteLLM Proxy Development Configuration
# Reduced model list for fast local iteration; verbose logging enabled.
# All models route through OpenRouter (single API key).

model_list:
  # ─── argus/auto group (dev: 2 models only for speed) ───
  - model_name: argus/auto
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      id: openai/gpt-6-luna-proxy
      max_tokens: 16384

  - model_name: argus/auto
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      id: deepseek-proxy
      max_tokens: 32768

  # ─── Specific models (dev subset) ───
  - model_name: openai/gpt-6-luna
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: deepseek/deepseek-v4.1-flash-1017
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

router_settings:
  routing_strategy: least-busy
  num_retries: 2
  retry_after: 1
  allowed_fails: 3
  cooldown_time: 30
  fallbacks:
    - argus/auto:
        - openai/gpt-6-luna
        - deepseek/deepseek-v4.1-flash-1017

litellm_settings:
  drop_params: true
  request_timeout: 120
  streaming_timeout: 120
  set_verbose: true       # <-- verbose logging for local debugging
  json_logs: false        # human-readable logs in dev

general_settings:
  master_key: os.environ/LITELLM_INTERNAL_KEY
  disable_spend_logs: true
  disable_error_logs: false
  store_model_in_db: false
  allow_requests_on_db_fail: true
