# Production overrides for the Argus LLM Gateway.
#
# Usage (always layer on top of the base file):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this file changes vs the base:
#   - Keeps the localhost port binding (127.0.0.1:4000) — the Rust gateway
#     binary runs on the host and reaches LiteLLM via localhost:4000.
#   - Adds memory and CPU hard limits to prevent runaway resource usage.
#   - Sets restart: always for prod resilience.
#
# NOTE: The Rust API gateway is a bare systemd binary (not a container),
# so there is NO shared Docker network needed — localhost:4000 is sufficient.

version: "3.9"

services:
  llm-gateway:
    restart: always

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m
          cpus: "0.25"

    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_INTERNAL_KEY=${LITELLM_INTERNAL_KEY}

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
