# Production overrides for the Argus LLM Gateway.
#
# Usage (always layer on top of the base file):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this file changes vs the base:
#   - Adds memory and CPU hard limits to prevent runaway resource usage.
#   - Sets restart: always for prod resilience.
#
# NOTE: The Rust API gateway runs on a separate EC2 instance and reaches this
# service over the private VPC network. Port 4000 must only be reachable from
# the API instance's security group, never from the public internet.

services:
  llm-gateway:
    restart: always

    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 128m
          cpus: "0.25"

    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_INTERNAL_KEY=${LITELLM_INTERNAL_KEY}

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
