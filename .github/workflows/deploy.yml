name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: "Which app to deploy"
        type: choice
        options: [all, api, dashboard]
        default: all

env:
  INSTANCE_ID: i-0ca849fa6f19b0fd1
  REGION: eu-north-1

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.detect.outputs.api }}
      dashboard: ${{ steps.detect.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed apps
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            comp="${{ inputs.component }}"
            api=false; dashboard=false
            if [ "$comp" = "all" ] || [ "$comp" = "api" ]; then api=true; fi
            if [ "$comp" = "all" ] || [ "$comp" = "dashboard" ]; then dashboard=true; fi
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            echo "changed files:"; echo "$changed"
            api=false; dashboard=false
            if echo "$changed" | grep -qE '^(apps/api/|test/|\.github/workflows/deploy\.yml$)'; then api=true; fi
            if echo "$changed" | grep -qE '^(apps/dashboard/|packages/|bun\.lock$|turbo\.json$|\.github/workflows/deploy\.yml$)'; then dashboard=true; fi
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libicu-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --manifest-path apps/api/Cargo.toml
        env:
          RUST_ICU_MAJOR_VERSION_NUMBER: "74"
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: apps/api/target/release/api
          retention-days: 7

  deploy-api:
    needs: [changes, build-api]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: .
      - name: Resolve instance address
        id: ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --region "$REGION" \
            --query "Reservations[].Instances[0].{state:State.Name,ip:PublicIpAddress}" \
            --output json > instance.json
          state=$(jq -r '.[0].state' instance.json)
          echo "instance state: $state"
          if [ "$state" != "running" ]; then
            echo "::notice::Instance is $state (paused) — skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ip=$(jq -r '.[0].ip' instance.json)" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.ip.outputs.skip == 'false'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IP: ${{ steps.ip.outputs.ip }}
        run: |
          printf '%s' "$EC2_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          scp -i deploy_key -o StrictHostKeyChecking=accept-new ./api "ubuntu@$IP:/tmp/api"
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new "ubuntu@$IP" \
            'sudo install -m 0755 /tmp/api /opt/argus/api && sudo systemctl restart argus-api && \
             for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v1/health && echo && echo DEPLOY_OK && exit 0; sleep 2; done; echo "health check timed out"; exit 1'

  deploy-dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Amplify release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
          AMPLIFY_REGION: ${{ vars.AMPLIFY_REGION }}
        run: |
          if [ -z "$AMPLIFY_APP_ID" ] || [ -z "$AMPLIFY_BRANCH" ] || [ -z "$AMPLIFY_REGION" ]; then
            echo "::error::Set repo variables AMPLIFY_APP_ID, AMPLIFY_BRANCH and AMPLIFY_REGION"
            exit 1
          fi
          aws amplify start-job --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --region "$AMPLIFY_REGION" \
            --query 'jobSummary.{jobId:jobId,status:status}' --output table
