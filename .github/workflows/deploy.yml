name: deploy-router
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component (llm-gateway is the only CI-managed component)
        type: choice
        options: [llm-gateway]
        default: llm-gateway

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  LLM_ROUTER_INSTANCE_ID: i-06f4f9e4f071408a4
  DEPLOY_BUCKET: argus-deploy-660659242753-eu-north-1
  REGION: eu-north-1

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      llm-gateway: ${{ steps.detect.outputs.llm_gateway }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect router changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "llm_gateway=true" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            printf '%s\n' "$changed"
            llm_gateway=false
            printf '%s\n' "$changed" | grep -qE '^(llm-gateway/|apps/api/catalog/models\.json$|\.github/workflows/deploy\.yml$)' && llm_gateway=true
            echo "llm_gateway=$llm_gateway" >> "$GITHUB_OUTPUT"
          fi

  deploy-router:
    needs: changes
    if: needs.changes.outputs['llm-gateway'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Package and upload release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p llm-gateway/catalog
          cp apps/api/catalog/models.json llm-gateway/catalog/models.json
          tar -czf /tmp/llm-gateway.tgz \
            -C llm-gateway \
            docker-compose.yml \
            docker-compose.prod.yml \
            catalog \
            config \
            scripts
          aws s3 cp \
            /tmp/llm-gateway.tgz \
            "s3://$DEPLOY_BUCKET/llm-gateway/${{ github.sha }}.tgz" \
            --region "$REGION" \
            --only-show-errors

      - name: Sync router secrets to Parameter Store
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LITELLM_INTERNAL_KEY: ${{ secrets.LITELLM_INTERNAL_KEY }}
        run: |
          aws ssm put-parameter \
            --region "$REGION" \
            --name /argus/llm-gateway/openrouter-api-key \
            --type SecureString \
            --value "$OPENROUTER_API_KEY" \
            --overwrite > /dev/null
          aws ssm put-parameter \
            --region "$REGION" \
            --name /argus/llm-gateway/internal-key \
            --type SecureString \
            --value "$LITELLM_INTERNAL_KEY" \
            --overwrite > /dev/null
          router_url=$(aws ec2 describe-instances \
            --region "$REGION" \
            --instance-ids "$LLM_ROUTER_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)
          aws ssm put-parameter \
            --region "$REGION" \
            --name /argus/llm-gateway/url \
            --type String \
            --value "http://$router_url:4000" \
            --overwrite > /dev/null

      - name: Deploy router through SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          artifact_uri="s3://$DEPLOY_BUCKET/llm-gateway/${{ github.sha }}.tgz"
          remote_command=$(cat <<EOF
          set -eu
          cloud-init status --wait
          install -d -m 0755 /opt/llm-gateway
          aws s3 cp '$artifact_uri' /tmp/llm-gateway.tgz --region '$REGION' --only-show-errors
          tar -xzf /tmp/llm-gateway.tgz -C /opt/llm-gateway
          chmod +x /opt/llm-gateway/scripts/*.sh
          AWS_REGION='$REGION' /opt/llm-gateway/scripts/deploy-ec2.sh
          EOF
          )
          parameters=$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]]}))' "$remote_command")
          command_id=$(aws ssm send-command \
            --region "$REGION" \
            --instance-ids "$LLM_ROUTER_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Argus LLM gateway ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters "$parameters" \
            --query Command.CommandId \
            --output text)
          status=Pending
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --region "$REGION" \
              --command-id "$command_id" \
              --instance-id "$LLM_ROUTER_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$status" in
              Success|Cancelled|Failed|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$command_id" \
            --instance-id "$LLM_ROUTER_INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
          [ "$status" = Success ]
